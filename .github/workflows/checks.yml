name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Shell checks
        run: |
          bash -n scripts/build-release.sh
          shellcheck scripts/build-release.sh
          sh -n modules/play-provenance-repair/playfix.sh
          sh -n modules/play-provenance-repair/customize.sh
          sh -n modules/playstore-xray-privacy-filter/customize.sh
          shellcheck -s sh modules/play-provenance-repair/playfix.sh modules/playstore-xray-privacy-filter/customize.sh
      - name: Regression tests
        run: |
          python3 -m unittest discover -s tests
          bun test
