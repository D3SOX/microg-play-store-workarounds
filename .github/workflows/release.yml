name: Point release at clean source

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 0

      - name: Retarget release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v2026.09.17 "$TARGET_SHA"
          git push origin refs/tags/v2026.09.17 --force
          gh release edit v2026.09.17 --target "$TARGET_SHA" --title v2026.09.17
