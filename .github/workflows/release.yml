name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Always build the tagged commit, also for manual runs from a branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Build release archives
        run: ./scripts/build-release.sh

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --verify-tag --title "$TAG" --generate-notes
          fi
